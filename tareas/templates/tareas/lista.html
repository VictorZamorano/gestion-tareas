<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Gestor de Tareas</title>
  </head>
  <body>
    <h1>Lista de Tareas</h1>
    <a href="{% url 'crear_tarea' %}">+ Crear nueva tarea</a>
    <ul>
      {% for tarea in tareas %}
      <li>
        <strong
          >{% if tarea.completada %}<s>{{ tarea.titulo }}</s>{% else %}{{
          tarea.titulo }}{% endif %}</strong
        >
        <p>{{ tarea.descripcion }}</p>
        <a href="{% url 'editar_tarea' tarea.pk %}">Editar</a> |
        <a href="{% url 'eliminar_tarea' tarea.pk %}">Eliminar</a>
      </li>
      {% empty %}
      <li>No hay tareas pendientes.</li>
      {% endfor %}
    </ul>
  </body>
</html>
