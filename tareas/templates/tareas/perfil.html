<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil de Usuario</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen text-slate-800">

    <div class="max-w-md mx-auto py-12 px-4">
      <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200">

        <!-- Cabecera y Navegación -->
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold text-slate-700">Mi Perfil</h2>
          <a href="{% url 'pantalla_tareas' %}" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium">← Volver a Tareas</a>
        </div>

        <!-- Contenedor de Datos del Usuario -->
        <div id="info-usuario" class="space-y-4">
          <p class="text-slate-400 italic">Cargando datos del usuario...</p>
        </div>

        <!-- Botón Cerrar Sesión -->
        <div class="mt-8 pt-4 border-t border-slate-100 flex justify-end">
          <button onclick="cerrarSesion()" class="bg-red-500 hover:bg-red-600 text-white font-medium px-4 py-2 rounded-lg transition duration-200 text-sm">
            Cerrar Sesión
          </button>
        </div>

      </div>
    </div>

    <script>
      // 1. Obtener el Token JWT del almacenamiento local
      const token = localStorage.getItem("access_token");

      // Si no hay token, redirigir al login
      if (!token) {
        window.location.href = '{% url "pantalla_login" %}';
      }

      // 2. Consultar los datos del usuario autenticado (GET /api/perfil/)
      async function cargarPerfil() {
        try {
          const response = await fetch("/api/perfil/", {
            method: "GET",
            headers: {
              "Authorization": `Bearer ${token}`,
              "Content-Type": "application/json"
            }
          });

          if (response.status === 401) {
            alert("Sesión expirada o token inválido.");
            cerrarSesion();
            return;
          }

          const user = await response.json();
          const contenedor = document.getElementById("info-usuario");

          // Pintar los datos en pantalla de forma segura contra XSS
          contenedor.innerHTML = `
            <div class="bg-slate-50 p-4 rounded-lg border border-slate-100 space-y-3">
              <div>
                <span class="text-xs text-slate-400 block uppercase font-semibold">ID de Usuario</span>
                <span class="font-medium text-slate-700">${user.id}</span>
              </div>
              <div>
                <span class="text-xs text-slate-400 block uppercase font-semibold">Nombre de Usuario</span>
                <span class="font-medium text-slate-700">${user.username}</span>
              </div>
              <div>
                <span class="text-xs text-slate-400 block uppercase font-semibold">Correo Electrónico</span>
                <span class="font-medium text-slate-700">${user.email || "No especificado"}</span>
              </div>
              <div>
                <span class="text-xs text-slate-400 block uppercase font-semibold">Rol Asignado</span>
                <span class="inline-block mt-1 px-2.5 py-1 bg-indigo-100 text-indigo-700 rounded-md text-xs font-bold uppercase">${user.rol}</span>
              </div>
              <div>
                <span class="text-xs text-slate-400 block uppercase font-semibold">Fecha de Registro</span>
                <span class="font-medium text-slate-700">${new Date(user.date_joined).toLocaleDateString()}</span>
              </div>
            </div>
          `;
        } catch (error) {
          console.error("Error al cargar perfil:", error);
        }
      }

      // Función para cerrar sesión limpiando el almacenamiento
      function cerrarSesion() {
        localStorage.removeItem("access_token");
        localStorage.removeItem("refresh_token");
        window.location.href = '{% url "pantalla_login" %}';
      }

      // Ejecutar al cargar la vista
      cargarPerfil();
    </script>
  </body>
</html>
