<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Eliminar Tarea</title>
  </head>
  <body>
    <h1>¿Estás seguro de que deseas eliminar "{{ tarea.titulo }}"?</h1>
    <form method="POST">
      {% csrf_token %}
      <button type="submit">Sí, eliminar</button>
      <a href="{% url 'lista_tareas' %}">Cancelar</a>
    </form>
  </body>
</html>
